name: Release RISC-V Toolchain and Spike (Linux)

on:
    workflow_dispatch:
        inputs:
            toolchain_configure_args:
                description: >-
                    Extra arguments appended to "./configure --prefix=${INSTALL_PREFIX}" when building
                    riscv-gnu-toolchain. Tip: if you need semicolons (e.g., --with-multilib-generator),
                    do NOT add quotes; this workflow passes the input through an environment variable
                    so semicolons are safe.
                    Example (RV64 + multilib RV32, soft-float ABI):
                    --enable-multilib --with-arch=rv64gc --with-abi=lp64 --with-multilib-generator=rv32imac-ilp32--;rv64gc-lp64--
                required: false
                default: "--with-arch=rv64gc --with-abi=lp64d"
            gcc_cfi_branch:
                description: Branch to clone from Zxis233/gcc-cfi
                required: true
                default: "explicit-label"
                type: string
            gcc_cfi_commit:
                description: Optional full 40-character commit hash from the selected GCC CFI branch; empty uses the branch tip
                required: false
                default: ""
                type: string
            release_mode:
                description: Publish the build as a GitHub Release, prerelease, or artifact only
                required: true
                default: none
                type: choice
                options:
                    - none
                    - release
                    - prerelease

env:
    TOOLCHAIN_FILENAME: riscv-gnu-toolchain-spike_linux
    INSTALL_PREFIX: /opt/riscv

jobs:
    build-toolchain-and-spike:
        runs-on: ubuntu-24.04

        steps:
            - name: Free up disk space
              run: |
                  echo "=== Before cleanup ==="
                  df -h
                  # 删除不需要的软件和文件
                  sudo rm -rf /usr/share/dotnet
                  sudo rm -rf /usr/local/lib/android
                  sudo rm -rf /opt/ghc
                  sudo rm -rf /opt/hostedtoolcache/CodeQL
                  sudo docker image prune --all --force
                  sudo apt-get clean
                  echo "=== After cleanup ==="
                  df -h

            - name: Checkout GNU Toolchain repository
              uses: actions/checkout@v4
              with:
                  repository: Zxis233/riscv-gnu-toolchain
                  path: riscv-gnu-toolchain
                  fetch-depth: 1

            - name: Checkout GCC CFI repository
              uses: actions/checkout@v4
              with:
                  repository: Zxis233/gcc-cfi
                  ref: ${{ inputs.gcc_cfi_branch }}
                  path: gcc-cfi
                  fetch-depth: 1

            - name: Resolve GCC CFI revision
              env:
                  GCC_CFI_BRANCH_INPUT: ${{ inputs.gcc_cfi_branch }}
                  GCC_CFI_COMMIT_INPUT: ${{ inputs.gcc_cfi_commit }}
              run: |
                  set -euo pipefail

                  if [ -n "${GCC_CFI_COMMIT_INPUT}" ]; then
                      if [[ ! "${GCC_CFI_COMMIT_INPUT}" =~ ^[0-9a-fA-F]{40}$ ]]; then
                          echo "GCC CFI commit must be a full 40-character hexadecimal hash." >&2
                          exit 1
                      fi

                      git -C gcc-cfi fetch --no-tags --depth 1 origin "${GCC_CFI_COMMIT_INPUT}"
                      git -C gcc-cfi checkout --detach FETCH_HEAD
                  fi

                  RESOLVED_GCC_CFI_COMMIT=$(git -C gcc-cfi rev-parse HEAD)
                  if [ -n "${GCC_CFI_COMMIT_INPUT}" ] &&
                     [[ "${RESOLVED_GCC_CFI_COMMIT}" != "${GCC_CFI_COMMIT_INPUT}"* ]]; then
                      echo "Resolved GCC CFI commit does not match the requested hash." >&2
                      exit 1
                  fi

                  echo "GCC_CFI_BRANCH=${GCC_CFI_BRANCH_INPUT}" >> "$GITHUB_ENV"
                  echo "GCC_CFI_COMMIT=${RESOLVED_GCC_CFI_COMMIT}" >> "$GITHUB_ENV"

                  echo "GCC CFI branch: ${GCC_CFI_BRANCH_INPUT}"
                  echo "GCC CFI commit: ${RESOLVED_GCC_CFI_COMMIT}"
                  {
                      echo "### GCC CFI source"
                      echo "- Branch: \`${GCC_CFI_BRANCH_INPUT}\`"
                      echo "- Commit: \`${RESOLVED_GCC_CFI_COMMIT}\`"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Install dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    autoconf \
                    automake \
                    autotools-dev \
                    curl \
                    python3 \
                    python3-pip \
                    python3-tomli \
                    libmpc-dev \
                    libmpfr-dev \
                    libgmp-dev \
                    gawk \
                    build-essential \
                    bison \
                    flex \
                    texinfo \
                    gperf \
                    libtool \
                    patchutils \
                    bc \
                    zlib1g-dev \
                    libexpat-dev \
                    ninja-build \
                    git \
                    cmake \
                    libglib2.0-dev \
                    libslirp-dev \
                    device-tree-compiler \
                    libboost-regex-dev \
                    libboost-system-dev

            - name: Create installation directory
              run: |
                  sudo mkdir -p ${{ env.INSTALL_PREFIX }}
                  sudo chown -R $USER:$USER ${{ env.INSTALL_PREFIX }}

            - name: Resolve toolchain target settings
              env:
                  TOOLCHAIN_CONFIGURE_ARGS: ${{ github.event.inputs.toolchain_configure_args }}
              run: |
                  TOOLCHAIN_ARGS="${TOOLCHAIN_CONFIGURE_ARGS:-}"
                  if [ -z "${TOOLCHAIN_ARGS}" ]; then
                      TOOLCHAIN_ARGS="--with-arch=rv64gc --with-abi=lp64d"
                  fi

                  ARCH=$(printf '%s\n' "${TOOLCHAIN_ARGS}" | sed -n 's/.*--with-arch=\([^[:space:]]*\).*/\1/p' | head -n1)
                  ABI=$(printf '%s\n' "${TOOLCHAIN_ARGS}" | sed -n 's/.*--with-abi=\([^[:space:]]*\).*/\1/p' | head -n1)

                  if [ -z "${ARCH}" ]; then ARCH="unknown"; fi
                  if [ -z "${ABI}" ]; then ABI="unknown"; fi

                  case "${ARCH}" in
                      rv32*)
                          XLEN=32
                          ;;
                      rv64*)
                          XLEN=64
                          ;;
                      *)
                          case "${ABI}" in
                              ilp32*)
                                  XLEN=32
                                  ;;
                              lp64*)
                                  XLEN=64
                                  ;;
                              *)
                                  echo "Unable to infer target XLEN from configure args: ${TOOLCHAIN_ARGS}" >&2
                                  exit 1
                                  ;;
                          esac
                          ;;
                  esac

                  ELF_TRIPLE="riscv${XLEN}-unknown-elf"
                  LINUX_TRIPLE="riscv${XLEN}-unknown-linux-gnu"
                  PK_INSTALL_DIR="${{ env.INSTALL_PREFIX }}/${ELF_TRIPLE}"

                  echo "RISCV_ARCH=${ARCH}" >> "$GITHUB_ENV"
                  echo "RISCV_ABI=${ABI}" >> "$GITHUB_ENV"
                  echo "RISCV_XLEN=${XLEN}" >> "$GITHUB_ENV"
                  echo "RISCV_ELF_TRIPLE=${ELF_TRIPLE}" >> "$GITHUB_ENV"
                  echo "RISCV_LINUX_TRIPLE=${LINUX_TRIPLE}" >> "$GITHUB_ENV"
                  echo "RISCV_PK_INSTALL_DIR=${PK_INSTALL_DIR}" >> "$GITHUB_ENV"

                  echo "Resolved toolchain settings:"
                  echo "  arch=${ARCH}"
                  echo "  abi=${ABI}"
                  echo "  xlen=${XLEN}"
                  echo "  elf triple=${ELF_TRIPLE}"
                  echo "  linux triple=${LINUX_TRIPLE}"
                  echo "  pk install dir=${PK_INSTALL_DIR}"

            - name: Fetch required GNU Toolchain submodules reliably
              shell: bash
              run: |
                  set -euo pipefail
                  cd riscv-gnu-toolchain

                  # Synchronize the original submodule metadata first. URL overrides
                  # must be applied afterwards, otherwise "git submodule sync" would
                  # restore the Sourceware URLs from .gitmodules.
                  git submodule sync --recursive

                  # Binutils and GDB are hosted in the same Sourceware repository.
                  # Use Google's read-only mirror to avoid Sourceware HTTP 429 errors.
                  git submodule set-url \
                      binutils \
                      https://gnu.googlesource.com/binutils-gdb

                  git submodule set-url \
                      gdb \
                      https://gnu.googlesource.com/binutils-gdb

                  echo "Configured submodule URLs:"
                  git config --get-regexp '^submodule\.(binutils|gdb|newlib)\.url$' || true

                  fetch_submodule() {
                      local path="$1"
                      local attempt
                      local max_attempts=5
                      local delay=20

                      for attempt in $(seq 1 "${max_attempts}"); do
                          echo "::group::Fetching ${path}, attempt ${attempt}/${max_attempts}"

                          if git \
                              -c protocol.version=2 \
                              -c submodule.fetchJobs=1 \
                              submodule update \
                              --init \
                              --force \
                              --jobs 1 \
                              --no-recommend-shallow \
                              --filter=blob:none \
                              -- "${path}"; then
                              echo "::endgroup::"
                              echo "Successfully fetched ${path}"
                              return 0
                          fi

                          echo "::endgroup::"
                          echo "Fetch of ${path} failed."

                          # Remove any incomplete checkout before retrying.
                          git submodule deinit -f -- "${path}" || true
                          rm -rf "${path}"
                          rm -rf ".git/modules/${path}"

                          if [ "${attempt}" -eq "${max_attempts}" ]; then
                              echo "Failed to fetch ${path} after ${max_attempts} attempts." >&2
                              return 1
                          fi

                          echo "Retrying ${path} in ${delay} seconds..."
                          sleep "${delay}"
                          delay=$((delay * 2))
                      done
                  }

                  # The default bare-metal/Newlib build requires these submodules.
                  # GCC itself is supplied separately through --with-gcc-src.
                  fetch_submodule binutils
                  fetch_submodule newlib
                  fetch_submodule gdb

                  echo "Final submodule state:"
                  git submodule status -- binutils newlib gdb

                  # Fail early before the long build if a source tree is incomplete.
                  test -x binutils/configure
                  test -x newlib/configure
                  test -x gdb/configure

                  echo "Required toolchain submodules are ready."

            - name: Diagnose toolchain source revisions
              shell: bash
              run: |
                  set -euo pipefail
                  cd riscv-gnu-toolchain

                  echo "Superproject:"
                  git rev-parse HEAD

                  for module in binutils newlib gdb; do
                      echo
                      echo "=== ${module} ==="
                      echo "Expected:"
                      git rev-parse "HEAD:${module}"

                      echo "Checked out:"
                      git -C "${module}" rev-parse HEAD

                      echo "Remote:"
                      git -C "${module}" remote -v
                  done

            - name: Configure GNU Toolchain
              env:
                  # Pass through the workflow_dispatch input as an environment variable to avoid
                  # shell quoting issues (e.g., semicolons in --with-multilib-generator).
                  TOOLCHAIN_CONFIGURE_ARGS: ${{ github.event.inputs.toolchain_configure_args }}
              run: |
                  cd riscv-gnu-toolchain

                  TOOLCHAIN_ARGS="${TOOLCHAIN_CONFIGURE_ARGS:-}"
                  if [ -z "${TOOLCHAIN_ARGS}" ]; then
                      TOOLCHAIN_ARGS="--with-arch=rv64gc --with-abi=lp64d"
                  fi

                  echo "Toolchain configure args: ${TOOLCHAIN_ARGS}"

                  # Avoid pathname expansion if the user passes characters like '*'.
                  set -f

                  ./configure --prefix="${{ env.INSTALL_PREFIX }}" ${TOOLCHAIN_ARGS} \
                      --with-gcc-src="${GITHUB_WORKSPACE}/gcc-cfi"

            - name: Build GNU Toolchain
              run: |
                  cd riscv-gnu-toolchain
                  make -j$(nproc)
              timeout-minutes: 360

            - name: Install GNU Toolchain
              run: |
                  cd riscv-gnu-toolchain
                  make install

            - name: Clean up toolchain build files
              run: |
                  echo "=== Disk usage before cleanup ==="
                  df -h
                  # 清理编译产生的中间文件
                  cd riscv-gnu-toolchain
                  make clean || true
                  cd ..
                  # 删除源代码目录以释放空间
                  rm -rf riscv-gnu-toolchain gcc-cfi
                  echo "=== Disk usage after cleanup ==="
                  df -h

            - name: Verify Toolchain installation
              run: |
                  export PATH=${{ env.INSTALL_PREFIX }}/bin:$PATH
                  ${RISCV_ELF_TRIPLE}-gcc --version
                  ${RISCV_LINUX_TRIPLE}-gcc --version || echo "Linux toolchain not built"

            - name: Checkout pk (Proxy Kernel) repository
              uses: actions/checkout@v4
              with:
                  repository: riscv-software-src/riscv-pk
                  path: riscv-pk
                  fetch-depth: 1

            - name: Configure pk
              run: |
                  cd riscv-pk
                  mkdir build
                  cd build
                  export PATH=${{ env.INSTALL_PREFIX }}/bin:$PATH
                  ../configure --prefix=${{ env.INSTALL_PREFIX }} --host=${RISCV_ELF_TRIPLE}

            - name: Build pk
              run: |
                  cd riscv-pk/build
                  export PATH=${{ env.INSTALL_PREFIX }}/bin:$PATH
                  make -j$(nproc)
              timeout-minutes: 30

            - name: Install pk
              run: |
                  cd riscv-pk/build
                  make install

            - name: Clean up pk build files
              run: |
                  echo "=== Disk usage before pk cleanup ==="
                  df -h
                  # 清理 pk 编译文件
                  rm -rf riscv-pk
                  echo "=== Disk usage after pk cleanup ==="
                  df -h

            - name: Verify pk installation
              run: |
                  ls -lh ${RISCV_PK_INSTALL_DIR}/bin/pk
                  file ${RISCV_PK_INSTALL_DIR}/bin/pk

            - name: Checkout Spike repository
              uses: actions/checkout@v4
              with:
                  repository: riscv-software-src/riscv-isa-sim
                  path: riscv-isa-sim
                  fetch-depth: 1
                  submodules: recursive

            - name: Configure Spike
              run: |
                  cd riscv-isa-sim
                  mkdir build
                  cd build
                  ../configure --prefix=${{ env.INSTALL_PREFIX }}

            - name: Build Spike
              run: |
                  cd riscv-isa-sim/build
                  make -j$(nproc)
              timeout-minutes: 60

            - name: Install Spike
              run: |
                  cd riscv-isa-sim/build
                  make install

            - name: Clean up Spike build files
              run: |
                  echo "=== Disk usage before Spike cleanup ==="
                  df -h
                  # 清理 Spike 编译文件
                  rm -rf riscv-isa-sim
                  echo "=== Disk usage after Spike cleanup ==="
                  df -h

            - name: Verify Spike installation
              run: |
                  ${{ env.INSTALL_PREFIX }}/bin/spike --help
                  echo "Spike version:"
                  ${{ env.INSTALL_PREFIX }}/bin/spike --version || true

            - name: List installed binaries
              run: |
                  echo "=== Installed binaries ==="
                  ls -lh ${{ env.INSTALL_PREFIX }}/bin/ | head -20
                  echo "=== Total files ==="
                  ls ${{ env.INSTALL_PREFIX }}/bin/ | wc -l

            - name: Create backup directory and copy Spike files
              run: |
                  mkdir -p /tmp/spike/bin
                  mkdir -p /tmp/spike/lib
                  mkdir -p /tmp/spike/include
                  mkdir -p /tmp/pk_backup/${RISCV_ELF_TRIPLE}/bin
                  # 备份 Spike 相关文件
                  cp ${{ env.INSTALL_PREFIX }}/bin/spike* /tmp/spike/bin/ 2>/dev/null || true
                  cp -r ${{ env.INSTALL_PREFIX }}/lib/libspike* /tmp/spike/lib/ 2>/dev/null || true
                  cp -r ${{ env.INSTALL_PREFIX }}/lib/libriscv* /tmp/spike/lib/ 2>/dev/null || true
                  cp -r ${{ env.INSTALL_PREFIX }}/include/spike /tmp/spike/include/ 2>/dev/null || true
                  # 备份 pk 相关文件
                  cp ${RISCV_PK_INSTALL_DIR}/bin/pk /tmp/pk_backup/${RISCV_ELF_TRIPLE}/bin/ 2>/dev/null || true
                  cp ${RISCV_PK_INSTALL_DIR}/bin/bbl /tmp/pk_backup/${RISCV_ELF_TRIPLE}/bin/ 2>/dev/null || true
                  echo "=== Spike files backed up ==="
                  find /tmp/spike -type f
                  echo "=== pk files backed up ==="
                  find /tmp/pk_backup -type f

            - name: Remove Spike files from installation
              run: |
                  # 从原安装目录中移除 Spike 文件
                  rm -f ${{ env.INSTALL_PREFIX }}/bin/spike*
                  rm -f ${{ env.INSTALL_PREFIX }}/lib/libspike*
                  rm -f ${{ env.INSTALL_PREFIX }}/lib/libriscv*
                  rm -rf ${{ env.INSTALL_PREFIX }}/include/spike
                  # 移除 pk 文件
                  rm -f ${RISCV_PK_INSTALL_DIR}/bin/pk
                  rm -f ${RISCV_PK_INSTALL_DIR}/bin/bbl

            - name: Package GNU Toolchain only
              run: |
                  cd /opt
                  tar -czf riscv-gnu-toolchain_linux.tar.gz riscv/
                  ls -lh riscv-gnu-toolchain_linux.tar.gz

            - name: Restore Spike files
              run: |
                  # 恢复 Spike 文件
                  cp -r /tmp/spike/bin/* ${{ env.INSTALL_PREFIX }}/bin/ 2>/dev/null || true
                  cp -r /tmp/spike/lib/* ${{ env.INSTALL_PREFIX }}/lib/ 2>/dev/null || true
                  cp -r /tmp/spike/include/* ${{ env.INSTALL_PREFIX }}/include/ 2>/dev/null || true
                  # 恢复 pk 文件
                  cp -r /tmp/pk_backup/${RISCV_ELF_TRIPLE}/* ${RISCV_PK_INSTALL_DIR}/ 2>/dev/null || true

            - name: Package Spike only
              run: |
                  cd /tmp
                  tar -czf spike-riscv-simulator_linux.tar.gz spike/
                  mv spike-riscv-simulator_linux.tar.gz /opt/
                  ls -lh /opt/spike-riscv-simulator_linux.tar.gz

            - name: Package pk only
              run: |
                  cd /tmp
                  tar -czf riscv-pk_linux.tar.gz pk_backup/
                  mv riscv-pk_linux.tar.gz /opt/
                  ls -lh /opt/riscv-pk_linux.tar.gz

            - name: Upload GNU Toolchain artifact
              uses: actions/upload-artifact@v4
              with:
                  name: riscv-gnu-toolchain_linux
                  path: /opt/riscv-gnu-toolchain_linux.tar.gz
                  retention-days: 30

            - name: Upload Spike artifact
              uses: actions/upload-artifact@v4
              with:
                  name: spike-riscv-simulator_linux
                  path: /opt/spike-riscv-simulator_linux.tar.gz
                  retention-days: 30

            - name: Upload pk artifact
              uses: actions/upload-artifact@v4
              with:
                  name: riscv-pk_linux
                  path: /opt/riscv-pk_linux.tar.gz
                  retention-days: 30

            - name: Generate release info
              if: ${{ inputs.release_mode != 'none' }}
              id: release_info
              run: |
                  # 生成时间戳
                  RELEASE_DATE=$(date +'%Y-%m-%d')
                  RELEASE_TIME=$(date +'%H:%M:%S UTC')
                  RELEASE_TAG="build-$(date +'%Y%m%d-%H%M%S')"
                  RELEASE_TITLE="RISC-V Toolchain Build - ${RELEASE_DATE} ${RELEASE_TIME}"

                  ARCH="${RISCV_ARCH:-unknown}"
                  ABI="${RISCV_ABI:-unknown}"
                  ELF_TRIPLE="${RISCV_ELF_TRIPLE:-riscv64-unknown-elf}"
                  GCC_BRANCH="${GCC_CFI_BRANCH:-unknown}"
                  GCC_COMMIT="${GCC_CFI_COMMIT:-unknown}"

                  # 生成 Release 说明
                  cat > /tmp/release_notes.md << EOF
                  # RISC-V Development Tools

                  **Build Date:** ${RELEASE_DATE}  
                  **Build Time:** ${RELEASE_TIME}  
                  **Build Status:** ✅ Success

                  ## 📦 Included Components

                  ### 1. RISC-V GNU Toolchain
                  - **File:** \`riscv-gnu-toolchain_linux.tar.gz\`
                  - **Architecture:** ${ARCH}
                  - **ABI:** ${ABI}
                  - **GCC CFI Branch:** \`${GCC_BRANCH}\`
                  - **GCC CFI Commit:** \`${GCC_COMMIT}\`
                  - **Includes:** gcc, g++, binutils, gdb, newlib

                  ### 2. Spike ISA Simulator
                  - **File:** \`spike-riscv-simulator_linux.tar.gz\`
                  - **Description:** RISC-V ISA Simulator

                  ### 3. Proxy Kernel (pk)
                  - **File:** \`riscv-pk_linux.tar.gz\`
                  - **Description:** Lightweight proxy kernel for Spike

                  ## 🚀 Quick Start

                  \`\`\`bash
                  # 1. Extract toolchain
                  tar -xzf riscv-gnu-toolchain_linux.tar.gz -C /opt/
                  export PATH=/opt/riscv/bin:\$PATH

                  # 2. Extract Spike (optional)
                  tar -xzf spike-riscv-simulator_linux.tar.gz
                  cp -r spike/* /opt/riscv/
                   
                  # 3. Extract pk (optional)
                  tar -xzf riscv-pk_linux.tar.gz
                  cp -r pk_backup/${ELF_TRIPLE}/* /opt/riscv/${ELF_TRIPLE}/
                  export PATH=/opt/riscv/${ELF_TRIPLE}/bin:\$PATH
                   
                  # 4. Test installation
                  ${ELF_TRIPLE}-gcc --version
                  spike --help
                   
                  # 5. Run a simple program
                  spike pk your_program
                  \`\`\`

                  ## 📝 Version Information

                  - **Runner OS:** Ubuntu Latest
                  - **Build Workflow:** GitHub Actions
                  - **Compiler Flags:** -march=${ARCH} -mabi=${ABI}

                  ## ⚠️ Notes

                  - All binaries are built for x86_64 Linux
                  - Tested on Ubuntu 22.04+
                  - Total size: ~2-3 GB (all components)

                  ---

                  Built with ❤️ by GitHub Actions
                  EOF

                  # 输出变量
                  echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
                  echo "release_title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT
                  echo "release_date=${RELEASE_DATE}" >> $GITHUB_OUTPUT
                  echo "release_time=${RELEASE_TIME}" >> $GITHUB_OUTPUT

                  cat /tmp/release_notes.md

            - name: Create Automatic Release
              if: ${{ inputs.release_mode != 'none' }}
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ steps.release_info.outputs.release_tag }}
                  name: ${{ steps.release_info.outputs.release_title }}
                  body_path: /tmp/release_notes.md
                  files: |
                      /opt/riscv-gnu-toolchain_linux.tar.gz
                      /opt/spike-riscv-simulator_linux.tar.gz
                      /opt/riscv-pk_linux.tar.gz
                  draft: false
                  prerelease: ${{ inputs.release_mode == 'prerelease' }}
                  make_latest: ${{ inputs.release_mode == 'release' }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
