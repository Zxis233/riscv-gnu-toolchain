name: Release RISC-V Toolchain and Spike (Linux glibc 2.28)

on:
    workflow_dispatch:
        inputs:
            toolchain_configure_args:
                description: >-
                    Extra arguments appended to "./configure --prefix=${INSTALL_PREFIX}" when building
                    riscv-gnu-toolchain. Tip: if you need semicolons (e.g., --with-multilib-generator),
                    do NOT add quotes; this workflow passes the input through an environment variable
                    so semicolons are safe.
                    Example (RV64 + multilib RV32, soft-float ABI):
                    --enable-multilib --with-arch=rv64gc --with-abi=lp64 --with-multilib-generator=rv32imac-ilp32--;rv64gc-lp64--
                required: false
                default: "--with-arch=rv64gc --with-abi=lp64d"
            gcc_cfi_branch:
                description: Branch to clone from Zxis233/gcc-cfi
                required: true
                default: "explicit-label"
                type: string
            gcc_cfi_commit:
                description: Optional full 40-character commit hash from the selected GCC CFI branch; empty uses the branch tip
                required: false
                default: ""
                type: string
            release_mode:
                description: Publish the build as a GitHub Release, prerelease, or artifact only
                required: true
                default: none
                type: choice
                options:
                    - none
                    - release
                    - prerelease

env:
    TOOLCHAIN_FILENAME: riscv-gnu-toolchain-spike_linux_glibc228
    INSTALL_PREFIX: /opt/riscv
    BUILD_IMAGE: rockylinux/rockylinux:8.10
    BUILD_CONTAINER: riscv-rocky810-build
    SPIKE_HOST_TOOLSET: gcc-toolset-13
    SPIKE_BOOST_VERSION: "1.83.0"
    SPIKE_BOOST_SHA256: "6478edfe2f3305127cffe8caf73ea0176c53769f4bf1585be237eb30798c3b8e"
    SPIKE_BOOST_PREFIX: /opt/spike-boost

jobs:
    build-toolchain-and-spike:
        runs-on: ubuntu-latest

        # Clean the Ubuntu host before starting the Rocky Linux 8.10 container.
        # All subsequent run steps default to Bash inside that container so
        # host-side binaries are built against Rocky's glibc 2.28.
        defaults:
            run:
                shell: rocky-bash {0}

        steps:
            - name: Free up disk space
              shell: bash
              run: |
                  echo "=== Before cleanup ==="
                  df -h
                  # 删除不需要的软件和文件
                  sudo rm -rf /usr/share/dotnet
                  sudo rm -rf /usr/local/lib/android
                  sudo rm -rf /opt/ghc
                  sudo rm -rf /opt/hostedtoolcache/CodeQL
                  sudo docker image prune --all --force
                  sudo apt-get clean
                  echo "=== After cleanup ==="
                  df -h

            - name: Start Rocky Linux 8.10 build container
              shell: bash
              run: |
                  # Share workspace, runner command files, and package locations
                  # with host-side checkout, artifact, and release actions.
                  docker run --detach \
                      --name "${BUILD_CONTAINER}" \
                      --user root \
                      --volume "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
                      --volume "${RUNNER_TEMP}:${RUNNER_TEMP}" \
                      --volume /opt:/opt \
                      --volume /tmp:/tmp \
                      --workdir "${GITHUB_WORKSPACE}" \
                      "${BUILD_IMAGE}" sleep infinity

                  cat > "${RUNNER_TEMP}/rocky-bash" <<'EOF'
                  #!/usr/bin/env bash
                  set -euo pipefail

                  # Forward current step inputs and command-file paths on every
                  # invocation, while keeping Rocky's own PATH and HOME.
                  container_env=()
                  while IFS= read -r name; do
                      case "${name}" in
                          GITHUB_*|RUNNER_TEMP|RUNNER_WORKSPACE|RISCV_*|GCC_CFI_*|TOOLCHAIN_*|SPIKE_*|INSTALL_PREFIX|CI)
                              container_env+=(--env "${name}")
                              ;;
                      esac
                  done < <(compgen -e)

                  exec docker exec \
                      "${container_env[@]}" \
                      --workdir "${PWD}" \
                      "${BUILD_CONTAINER}" \
                      bash --noprofile --norc -eo pipefail "$@"
                  EOF
                  chmod +x "${RUNNER_TEMP}/rocky-bash"
                  echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

            - name: Show Rocky Linux 8.10 build environment
              run: |
                  cat /etc/os-release
                  echo "=== glibc ==="
                  getconf GNU_LIBC_VERSION
                  test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
                  ldd --version 2>&1 | awk 'NR == 1 { print }'
                  echo "=== disk ==="
                  df -h

            - name: Install dependencies
              run: |
                  dnf -y update
                  dnf -y install dnf-plugins-core epel-release
                  dnf config-manager --set-enabled powertools || true

                  dnf -y install \
                    autoconf \
                    automake \
                    curl \
                    python3 \
                    python3-pip \
                    gmp-devel \
                    mpfr-devel \
                    libmpc-devel \
                    gawk \
                    gcc \
                    gcc-c++ \
                    make \
                    bison \
                    flex \
                    texinfo \
                    gperf \
                    libtool \
                    patchutils \
                    bc \
                    zlib-devel \
                    expat-devel \
                    ninja-build \
                    git \
                    cmake \
                    glib2-devel \
                    libslirp-devel \
                    dtc \
                    file \
                    findutils \
                    diffutils \
                    tar \
                    gzip \
                    xz \
                    bzip2 \
                    which \
                    hostname \
                    perl \
                    procps-ng \
                    binutils

                  python3 -m pip install --upgrade pip
                  python3 -m pip install tomli

                  # Checkout actions run as the Ubuntu user; builds run as root
                  # in Rocky, so trust the specific shared source directories.
                  for repo in riscv-gnu-toolchain gcc-cfi riscv-pk riscv-isa-sim; do
                      git config --global --add safe.directory "${GITHUB_WORKSPACE}/${repo}"
                  done

                  dnf clean all

                  echo "=== versions ==="
                  gcc --version 2>&1 | awk 'NR == 1 { print }'
                  g++ --version 2>&1 | awk 'NR == 1 { print }'
                  git --version
                  cmake --version 2>&1 | awk 'NR == 1 { print }'
                  getconf GNU_LIBC_VERSION

            - name: Install Spike host toolchain
              run: |
                  # EL8's GCC Toolset supplies the C++20 headers required by
                  # Spike while retaining the Rocky Linux 8 glibc baseline.
                  dnf -y install \
                      "${SPIKE_HOST_TOOLSET}-gcc" \
                      "${SPIKE_HOST_TOOLSET}-gcc-c++" \
                      "${SPIKE_HOST_TOOLSET}-binutils"
                  dnf clean all

                  source "/opt/rh/${SPIKE_HOST_TOOLSET}/enable"
                  echo "=== Spike host toolchain ==="
                  command -v gcc g++
                  gcc --version 2>&1 | awk 'NR == 1 { print }'
                  g++ --version 2>&1 | awk 'NR == 1 { print }'
                  test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"

            - name: Build Spike Boost dependencies
              run: |
                  source "/opt/rh/${SPIKE_HOST_TOOLSET}/enable"

                  # Rocky 8's Boost 1.66 headers use allocator members removed
                  # in C++20. Build a matching modern header/library pair.
                  boost_suffix="${SPIKE_BOOST_VERSION//./_}"
                  boost_archive="boost_${boost_suffix}.tar.bz2"
                  boost_build_dir=$(mktemp -d "${RUNNER_TEMP}/spike-boost.XXXXXX")
                  trap 'rm -rf "${boost_build_dir}"' EXIT

                  curl --fail --location --retry 5 --retry-delay 10 \
                      "https://archives.boost.io/release/${SPIKE_BOOST_VERSION}/source/${boost_archive}" \
                      --output "${boost_build_dir}/${boost_archive}"
                  printf '%s  %s\n' "${SPIKE_BOOST_SHA256}" "${boost_build_dir}/${boost_archive}" | sha256sum --check
                  tar -xjf "${boost_build_dir}/${boost_archive}" -C "${boost_build_dir}"
                  cd "${boost_build_dir}/boost_${boost_suffix}"

                  ./bootstrap.sh --with-toolset=gcc --with-libraries=regex,system \
                      --without-icu --prefix="${SPIKE_BOOST_PREFIX}" \
                      --libdir="${SPIKE_BOOST_PREFIX}/lib"
                  printf 'using gcc : : "%s" ;\n' \
                      "/opt/rh/${SPIKE_HOST_TOOLSET}/root/usr/bin/g++" > user-config.jam
                  # PIC is needed when these archives are linked into libriscv.
                  # Keep Boost static and its C/C++ runtime dynamically linked.
                  ./b2 -j"$(nproc)" --user-config="${PWD}/user-config.jam" \
                      --with-regex --with-system --disable-icu --layout=system \
                      toolset=gcc variant=release threading=multi cxxstd=20 \
                      link=static runtime-link=shared cxxflags=-fPIC \
                      --prefix="${SPIKE_BOOST_PREFIX}" \
                      --libdir="${SPIKE_BOOST_PREFIX}/lib" install

                  test -s "${SPIKE_BOOST_PREFIX}/include/boost/version.hpp"
                  test -s "${SPIKE_BOOST_PREFIX}/lib/libboost_regex.a"
                  test -s "${SPIKE_BOOST_PREFIX}/lib/libboost_system.a"
                  if find "${SPIKE_BOOST_PREFIX}/lib" -name 'libboost_*.so*' -print -quit | grep -q .; then
                      echo "ERROR: Spike's Boost prefix must contain only static Boost libraries." >&2
                      exit 1
                  fi
                  grep -E '^#define BOOST_(VERSION|LIB_VERSION) ' "${SPIKE_BOOST_PREFIX}/include/boost/version.hpp"
              timeout-minutes: 30

            - name: Checkout GNU Toolchain repository
              uses: actions/checkout@v4
              with:
                  repository: Zxis233/riscv-gnu-toolchain
                  path: riscv-gnu-toolchain
                  fetch-depth: 1

            - name: Checkout GCC CFI repository
              uses: actions/checkout@v4
              with:
                  repository: Zxis233/gcc-cfi
                  ref: ${{ inputs.gcc_cfi_branch }}
                  path: gcc-cfi
                  fetch-depth: 1

            - name: Resolve GCC CFI revision
              env:
                  GCC_CFI_BRANCH_INPUT: ${{ inputs.gcc_cfi_branch }}
                  GCC_CFI_COMMIT_INPUT: ${{ inputs.gcc_cfi_commit }}
              run: |
                  set -euo pipefail

                  if [ -n "${GCC_CFI_COMMIT_INPUT}" ]; then
                      if [[ ! "${GCC_CFI_COMMIT_INPUT}" =~ ^[0-9a-fA-F]{40}$ ]]; then
                          echo "GCC CFI commit must be a full 40-character hexadecimal hash." >&2
                          exit 1
                      fi

                      git -C gcc-cfi fetch --no-tags --depth 1 origin "${GCC_CFI_COMMIT_INPUT}"
                      git -C gcc-cfi checkout --detach FETCH_HEAD
                  fi

                  RESOLVED_GCC_CFI_COMMIT=$(git -C gcc-cfi rev-parse HEAD)
                  if [ -n "${GCC_CFI_COMMIT_INPUT}" ] &&
                     [[ "${RESOLVED_GCC_CFI_COMMIT}" != "${GCC_CFI_COMMIT_INPUT}"* ]]; then
                      echo "Resolved GCC CFI commit does not match the requested hash." >&2
                      exit 1
                  fi

                  echo "GCC_CFI_BRANCH=${GCC_CFI_BRANCH_INPUT}" >> "$GITHUB_ENV"
                  echo "GCC_CFI_COMMIT=${RESOLVED_GCC_CFI_COMMIT}" >> "$GITHUB_ENV"

                  echo "GCC CFI branch: ${GCC_CFI_BRANCH_INPUT}"
                  echo "GCC CFI commit: ${RESOLVED_GCC_CFI_COMMIT}"
                  {
                      echo "### GCC CFI source"
                      echo "- Branch: \`${GCC_CFI_BRANCH_INPUT}\`"
                      echo "- Commit: \`${RESOLVED_GCC_CFI_COMMIT}\`"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Create installation directory
              run: |
                  mkdir -p "${{ env.INSTALL_PREFIX }}"

            - name: Resolve toolchain target settings
              env:
                  TOOLCHAIN_CONFIGURE_ARGS: ${{ github.event.inputs.toolchain_configure_args }}
              run: |
                  TOOLCHAIN_ARGS="${TOOLCHAIN_CONFIGURE_ARGS:-}"
                  if [ -z "${TOOLCHAIN_ARGS}" ]; then
                      TOOLCHAIN_ARGS="--with-arch=rv64gc --with-abi=lp64d"
                  fi

                  ARCH=$(printf '%s\n' "${TOOLCHAIN_ARGS}" | sed -n 's/.*--with-arch=\([^[:space:]]*\).*/\1/p' | awk 'NR == 1 { print }')
                  ABI=$(printf '%s\n' "${TOOLCHAIN_ARGS}" | sed -n 's/.*--with-abi=\([^[:space:]]*\).*/\1/p' | awk 'NR == 1 { print }')

                  if [ -z "${ARCH}" ]; then ARCH="unknown"; fi
                  if [ -z "${ABI}" ]; then ABI="unknown"; fi

                  case "${ARCH}" in
                      rv32*)
                          XLEN=32
                          ;;
                      rv64*)
                          XLEN=64
                          ;;
                      *)
                          case "${ABI}" in
                              ilp32*)
                                  XLEN=32
                                  ;;
                              lp64*)
                                  XLEN=64
                                  ;;
                              *)
                                  echo "Unable to infer target XLEN from configure args: ${TOOLCHAIN_ARGS}" >&2
                                  exit 1
                                  ;;
                          esac
                          ;;
                  esac

                  ELF_TRIPLE="riscv${XLEN}-unknown-elf"
                  LINUX_TRIPLE="riscv${XLEN}-unknown-linux-gnu"
                  PK_INSTALL_DIR="${{ env.INSTALL_PREFIX }}/${ELF_TRIPLE}"

                  echo "RISCV_ARCH=${ARCH}" >> "$GITHUB_ENV"
                  echo "RISCV_ABI=${ABI}" >> "$GITHUB_ENV"
                  echo "RISCV_XLEN=${XLEN}" >> "$GITHUB_ENV"
                  echo "RISCV_ELF_TRIPLE=${ELF_TRIPLE}" >> "$GITHUB_ENV"
                  echo "RISCV_LINUX_TRIPLE=${LINUX_TRIPLE}" >> "$GITHUB_ENV"
                  echo "RISCV_PK_INSTALL_DIR=${PK_INSTALL_DIR}" >> "$GITHUB_ENV"

                  echo "Resolved toolchain settings:"
                  echo "  arch=${ARCH}"
                  echo "  abi=${ABI}"
                  echo "  xlen=${XLEN}"
                  echo "  elf triple=${ELF_TRIPLE}"
                  echo "  linux triple=${LINUX_TRIPLE}"
                  echo "  pk install dir=${PK_INSTALL_DIR}"

            - name: Fetch required GNU Toolchain submodules reliably
              run: |
                  set -euo pipefail
                  cd riscv-gnu-toolchain

                  # Synchronize the original submodule metadata first. URL overrides
                  # must be applied afterwards, otherwise "git submodule sync" would
                  # restore the Sourceware URLs from .gitmodules.
                  git submodule sync --recursive

                  # Binutils and GDB are hosted in the same Sourceware repository.
                  # Use Google's read-only mirror to avoid Sourceware HTTP 429 errors.
                  git submodule set-url \
                      binutils \
                      https://gnu.googlesource.com/binutils-gdb

                  git submodule set-url \
                      gdb \
                      https://gnu.googlesource.com/binutils-gdb

                  echo "Configured submodule URLs:"
                  git config --get-regexp '^submodule\.(binutils|gdb|newlib)\.url$' || true

                  fetch_submodule() {
                      local path="$1"
                      local attempt
                      local max_attempts=5
                      local delay=20

                      for attempt in $(seq 1 "${max_attempts}"); do
                          echo "::group::Fetching ${path}, attempt ${attempt}/${max_attempts}"

                          if git \
                              -c protocol.version=2 \
                              -c submodule.fetchJobs=1 \
                              submodule update \
                              --init \
                              --force \
                              --jobs 1 \
                              --no-recommend-shallow \
                              --filter=blob:none \
                              -- "${path}"; then
                              echo "::endgroup::"
                              echo "Successfully fetched ${path}"
                              return 0
                          fi

                          echo "::endgroup::"
                          echo "Fetch of ${path} failed."

                          # Remove any incomplete checkout before retrying.
                          git submodule deinit -f -- "${path}" || true
                          rm -rf "${path}"
                          rm -rf ".git/modules/${path}"

                          if [ "${attempt}" -eq "${max_attempts}" ]; then
                              echo "Failed to fetch ${path} after ${max_attempts} attempts." >&2
                              return 1
                          fi

                          echo "Retrying ${path} in ${delay} seconds..."
                          sleep "${delay}"
                          delay=$((delay * 2))
                      done
                  }

                  # The default bare-metal/Newlib build requires these submodules.
                  # GCC itself is supplied separately through --with-gcc-src.
                  fetch_submodule binutils
                  fetch_submodule newlib
                  fetch_submodule gdb

                  # Checkout can create submodule directories as the host user.
                  # Trust each initialized repository before entering it as root;
                  # safe.directory for the parent does not cover its submodules.
                  git submodule foreach --recursive \
                      'git config --global --add safe.directory "$PWD"'

                  echo "Final submodule state:"
                  git submodule status -- binutils newlib gdb

                  # Fail early before the long build if a source tree is incomplete.
                  test -x binutils/configure
                  test -x newlib/configure
                  test -x gdb/configure

                  echo "Required toolchain submodules are ready."

            - name: Diagnose toolchain source revisions
              run: |
                  set -euo pipefail
                  cd riscv-gnu-toolchain

                  echo "Superproject:"
                  git rev-parse HEAD

                  for module in binutils newlib gdb; do
                      echo
                      echo "=== ${module} ==="
                      echo "Expected:"
                      git rev-parse "HEAD:${module}"

                      echo "Checked out:"
                      git -C "${module}" rev-parse HEAD

                      echo "Remote:"
                      git -C "${module}" remote -v
                  done

            - name: Configure GNU Toolchain
              env:
                  TOOLCHAIN_CONFIGURE_ARGS: ${{ github.event.inputs.toolchain_configure_args }}
              run: |
                  cd riscv-gnu-toolchain

                  TOOLCHAIN_ARGS="${TOOLCHAIN_CONFIGURE_ARGS:-}"
                  if [ -z "${TOOLCHAIN_ARGS}" ]; then
                      TOOLCHAIN_ARGS="--with-arch=rv64gc --with-abi=lp64d"
                  fi

                  echo "Toolchain configure args: ${TOOLCHAIN_ARGS}"

                  # Avoid pathname expansion if the user passes characters like '*'.
                  set -f

                  ./configure --prefix="${{ env.INSTALL_PREFIX }}" ${TOOLCHAIN_ARGS} \
                      --with-gcc-src="${GITHUB_WORKSPACE}/gcc-cfi"

            - name: Build GNU Toolchain
              run: |
                  cd riscv-gnu-toolchain
                  make -j"$(nproc)"
              timeout-minutes: 360

            - name: Install GNU Toolchain
              run: |
                  cd riscv-gnu-toolchain
                  make install

            - name: Clean up toolchain build files
              run: |
                  echo "=== Disk usage before cleanup ==="
                  df -h
                  cd riscv-gnu-toolchain
                  make clean || true
                  cd ..
                  rm -rf riscv-gnu-toolchain gcc-cfi
                  echo "=== Disk usage after cleanup ==="
                  df -h

            - name: Verify Toolchain installation
              run: |
                  export PATH=${{ env.INSTALL_PREFIX }}/bin:$PATH
                  "${RISCV_ELF_TRIPLE}-gcc" --version
                  "${RISCV_LINUX_TRIPLE}-gcc" --version || echo "Linux toolchain not built"
                  "${RISCV_ELF_TRIPLE}-gcc" -print-multi-lib || true
                  file "${{ env.INSTALL_PREFIX }}/bin/${RISCV_ELF_TRIPLE}-gcc"
                  ldd "${{ env.INSTALL_PREFIX }}/bin/${RISCV_ELF_TRIPLE}-gcc" || true

            - name: Check required glibc versions of host binaries
              run: |
                  echo "Build container glibc:"
                  getconf GNU_LIBC_VERSION

                  echo "Required GLIBC symbol versions found in installed host binaries:"
                  required_versions_file=/tmp/required-glibc-versions.txt
                  : > "${required_versions_file}"

                  while IFS= read -r f; do
                      if file "$f" | grep -q 'ELF .*x86-64'; then
                          objdump -T "$f" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' >> "${required_versions_file}" || true
                      fi
                  done < <(find "${{ env.INSTALL_PREFIX }}" -type f -perm /111)

                  sort -V "${required_versions_file}" | uniq | tee /tmp/required-glibc-versions-sorted.txt

                  echo "Highest required GLIBC version:"
                  tail -n 1 /tmp/required-glibc-versions-sorted.txt

                  if grep -E 'GLIBC_2\.(29|3[0-9]|[4-9][0-9])' /tmp/required-glibc-versions-sorted.txt; then
                      echo "ERROR: Found GLIBC requirement newer than 2.28." >&2
                      exit 1
                  fi

            - name: Checkout pk (Proxy Kernel) repository
              uses: actions/checkout@v4
              with:
                  repository: riscv-software-src/riscv-pk
                  path: riscv-pk
                  fetch-depth: 1

            - name: Configure pk
              run: |
                  cd riscv-pk
                  mkdir build
                  cd build
                  export PATH=${{ env.INSTALL_PREFIX }}/bin:$PATH
                  ../configure --prefix=${{ env.INSTALL_PREFIX }} --host="${RISCV_ELF_TRIPLE}"

            - name: Build pk
              run: |
                  cd riscv-pk/build
                  export PATH=${{ env.INSTALL_PREFIX }}/bin:$PATH
                  make -j"$(nproc)"
              timeout-minutes: 30

            - name: Install pk
              run: |
                  cd riscv-pk/build
                  make install

            - name: Clean up pk build files
              run: |
                  echo "=== Disk usage before pk cleanup ==="
                  df -h
                  rm -rf riscv-pk
                  echo "=== Disk usage after pk cleanup ==="
                  df -h

            - name: Verify pk installation
              run: |
                  ls -lh "${RISCV_PK_INSTALL_DIR}/bin/pk"
                  file "${RISCV_PK_INSTALL_DIR}/bin/pk"

            - name: Checkout Spike repository
              uses: actions/checkout@v4
              with:
                  repository: riscv-software-src/riscv-isa-sim
                  path: riscv-isa-sim
                  fetch-depth: 1
                  submodules: recursive

            - name: Trust Spike submodule directories
              run: |
                  git -C riscv-isa-sim submodule foreach --recursive \
                      'git config --global --add safe.directory "$PWD"'

            - name: Configure Spike
              run: |
                  # Each docker exec starts a fresh shell; enable the toolset
                  # separately for configure, build, and install.
                  source "/opt/rh/${SPIKE_HOST_TOOLSET}/enable"
                  export CC="/opt/rh/${SPIKE_HOST_TOOLSET}/root/usr/bin/gcc"
                  export CXX="/opt/rh/${SPIKE_HOST_TOOLSET}/root/usr/bin/g++"
                  cd riscv-isa-sim
                  mkdir build
                  cd build
                  ../configure --prefix="${{ env.INSTALL_PREFIX }}" \
                      --with-boost="${SPIKE_BOOST_PREFIX}" \
                      --with-boost-libdir="${SPIKE_BOOST_PREFIX}/lib" \
                      --with-boost-asio=boost_system \
                      --with-boost-regex=boost_regex

                  # Fail here if detection falls back to old headers or silently
                  # disables the Boost-backed socket interface.
                  grep -F -- "${SPIKE_BOOST_PREFIX}/include" Makefile
                  grep -F -- "${SPIKE_BOOST_PREFIX}/lib" Makefile
                  grep -E '^#define HAVE_BOOST_ASIO([[:space:]]|$)' config.h
                  grep -E '^#define HAVE_BOOST_REGEX([[:space:]]|$)' config.h

            - name: Build Spike
              run: |
                  source "/opt/rh/${SPIKE_HOST_TOOLSET}/enable"
                  cd riscv-isa-sim/build
                  make -j"$(nproc)"
              timeout-minutes: 60

            - name: Install Spike
              run: |
                  source "/opt/rh/${SPIKE_HOST_TOOLSET}/enable"
                  cd riscv-isa-sim/build
                  make install

            - name: Clean up Spike build files
              run: |
                  echo "=== Disk usage before Spike cleanup ==="
                  df -h
                  rm -rf riscv-isa-sim
                  echo "=== Disk usage after Spike cleanup ==="
                  df -h

            - name: Verify Spike installation
              run: |
                  "${{ env.INSTALL_PREFIX }}/bin/spike" --help
                  echo "Spike version:"
                  "${{ env.INSTALL_PREFIX }}/bin/spike" --version || true
                  file "${{ env.INSTALL_PREFIX }}/bin/spike"
                  ldd "${{ env.INSTALL_PREFIX }}/bin/spike" || true

            - name: Check required glibc versions again after Spike
              run: |
                  required_versions_file=/tmp/required-glibc-versions-final.txt
                  : > "${required_versions_file}"

                  while IFS= read -r f; do
                      if file "$f" | grep -q 'ELF .*x86-64'; then
                          objdump -T "$f" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' >> "${required_versions_file}" || true
                      fi
                  done < <(find "${{ env.INSTALL_PREFIX }}" -type f -perm /111)

                  sort -V "${required_versions_file}" | uniq | tee /tmp/required-glibc-versions-final-sorted.txt

                  echo "Highest required GLIBC version:"
                  tail -n 1 /tmp/required-glibc-versions-final-sorted.txt

                  if grep -E 'GLIBC_2\.(29|3[0-9]|[4-9][0-9])' /tmp/required-glibc-versions-final-sorted.txt; then
                      echo "ERROR: Found GLIBC requirement newer than 2.28." >&2
                      exit 1
                  fi

            - name: List installed binaries
              run: |
                  echo "=== Installed binaries ==="
                  ls -lh ${{ env.INSTALL_PREFIX }}/bin/ | awk 'NR <= 20 { print }'
                  echo "=== Total files ==="
                  ls ${{ env.INSTALL_PREFIX }}/bin/ | wc -l

            - name: Create backup directory and copy Spike files
              run: |
                  mkdir -p /tmp/spike/bin
                  mkdir -p /tmp/spike/lib
                  mkdir -p /tmp/spike/include
                  mkdir -p "/tmp/pk_backup/${RISCV_ELF_TRIPLE}/bin"

                  cp ${{ env.INSTALL_PREFIX }}/bin/spike* /tmp/spike/bin/ 2>/dev/null || true
                  cp -r ${{ env.INSTALL_PREFIX }}/lib/libspike* /tmp/spike/lib/ 2>/dev/null || true
                  cp -r ${{ env.INSTALL_PREFIX }}/lib/libriscv* /tmp/spike/lib/ 2>/dev/null || true
                  cp -r ${{ env.INSTALL_PREFIX }}/include/spike /tmp/spike/include/ 2>/dev/null || true

                  cp "${RISCV_PK_INSTALL_DIR}/bin/pk" "/tmp/pk_backup/${RISCV_ELF_TRIPLE}/bin/" 2>/dev/null || true
                  cp "${RISCV_PK_INSTALL_DIR}/bin/bbl" "/tmp/pk_backup/${RISCV_ELF_TRIPLE}/bin/" 2>/dev/null || true

                  echo "=== Spike files backed up ==="
                  find /tmp/spike -type f
                  echo "=== pk files backed up ==="
                  find /tmp/pk_backup -type f

            - name: Remove Spike files from installation
              run: |
                  rm -f ${{ env.INSTALL_PREFIX }}/bin/spike*
                  rm -f ${{ env.INSTALL_PREFIX }}/lib/libspike*
                  rm -f ${{ env.INSTALL_PREFIX }}/lib/libriscv*
                  rm -rf ${{ env.INSTALL_PREFIX }}/include/spike

                  rm -f "${RISCV_PK_INSTALL_DIR}/bin/pk"
                  rm -f "${RISCV_PK_INSTALL_DIR}/bin/bbl"

            - name: Package GNU Toolchain only
              run: |
                  cd /opt
                  tar -czf riscv-gnu-toolchain_linux_glibc228.tar.gz riscv/
                  ls -lh riscv-gnu-toolchain_linux_glibc228.tar.gz

            - name: Restore Spike files
              run: |
                  cp -r /tmp/spike/bin/* ${{ env.INSTALL_PREFIX }}/bin/ 2>/dev/null || true
                  cp -r /tmp/spike/lib/* ${{ env.INSTALL_PREFIX }}/lib/ 2>/dev/null || true
                  cp -r /tmp/spike/include/* ${{ env.INSTALL_PREFIX }}/include/ 2>/dev/null || true

                  cp -r "/tmp/pk_backup/${RISCV_ELF_TRIPLE}"/* "${RISCV_PK_INSTALL_DIR}/" 2>/dev/null || true

            - name: Package Spike only
              run: |
                  cd /tmp
                  tar -czf spike-riscv-simulator_linux_glibc228.tar.gz spike/
                  mv spike-riscv-simulator_linux_glibc228.tar.gz /opt/
                  ls -lh /opt/spike-riscv-simulator_linux_glibc228.tar.gz

            - name: Package pk only
              run: |
                  cd /tmp
                  tar -czf riscv-pk_linux_glibc228.tar.gz pk_backup/
                  mv riscv-pk_linux_glibc228.tar.gz /opt/
                  ls -lh /opt/riscv-pk_linux_glibc228.tar.gz

            - name: Verify packaged Spike without GCC Toolset
              shell: bash
              run: |
                  # Only mount the archive: the clean runtime container must
                  # not inherit /opt/rh or libraries from the build container.
                  docker run --rm --interactive \
                      --user root \
                      --env INSTALL_PREFIX \
                      --env SPIKE_HOST_TOOLSET \
                      --env SPIKE_BOOST_PREFIX \
                      --volume /opt/spike-riscv-simulator_linux_glibc228.tar.gz:/tmp/spike.tar.gz:ro \
                      "${BUILD_IMAGE}" bash --noprofile --norc -eo pipefail <<'EOF'
                  # The fresh image does not inherit the build container's
                  # enabled repositories; Rocky 8 provides dtc in PowerTools.
                  dnf --enablerepo=powertools -y install libstdc++ libgcc dtc tar gzip
                  command -v dtc
                  dtc --version
                  dnf clean all
                  test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
                  test ! -e "/opt/rh/${SPIKE_HOST_TOOLSET}/enable"
                  test ! -e "${SPIKE_BOOST_PREFIX}"

                  mkdir -p "${INSTALL_PREFIX}"
                  tar -xzf /tmp/spike.tar.gz -C /tmp
                  cp -a /tmp/spike/. "${INSTALL_PREFIX}/"

                  echo "=== Spike runtime dependencies on Rocky Linux 8.10 ==="
                  ldd "${INSTALL_PREFIX}/bin/spike" | tee /tmp/spike-runtime-dependencies.txt
                  if grep -E 'not found|/opt/rh/|libboost_' /tmp/spike-runtime-dependencies.txt; then
                      echo "ERROR: Spike requires missing libraries, GCC Toolset, or shared Boost at runtime." >&2
                      exit 1
                  fi

                  # Resolve lazy-bound symbols as well, including C++ ABI
                  # symbols, before accepting the packaged executable.
                  LD_BIND_NOW=1 "${INSTALL_PREFIX}/bin/spike" --help
                  EOF

            - name: Upload GNU Toolchain artifact
              uses: actions/upload-artifact@v4
              with:
                  name: riscv-gnu-toolchain_linux_glibc228
                  path: /opt/riscv-gnu-toolchain_linux_glibc228.tar.gz
                  retention-days: 30

            - name: Upload Spike artifact
              uses: actions/upload-artifact@v4
              with:
                  name: spike-riscv-simulator_linux_glibc228
                  path: /opt/spike-riscv-simulator_linux_glibc228.tar.gz
                  retention-days: 30

            - name: Upload pk artifact
              uses: actions/upload-artifact@v4
              with:
                  name: riscv-pk_linux_glibc228
                  path: /opt/riscv-pk_linux_glibc228.tar.gz
                  retention-days: 30

            - name: Generate release info
              if: ${{ inputs.release_mode != 'none' }}
              id: release_info
              run: |
                  RELEASE_DATE=$(date +'%Y-%m-%d')
                  RELEASE_TIME=$(date +'%H:%M:%S UTC')
                  RELEASE_TAG="glibc228-build-$(date +'%Y%m%d-%H%M%S')"
                  RELEASE_TITLE="RISC-V Toolchain Build glibc 2.28 - ${RELEASE_DATE} ${RELEASE_TIME}"

                  ARCH="${RISCV_ARCH:-unknown}"
                  ABI="${RISCV_ABI:-unknown}"
                  ELF_TRIPLE="${RISCV_ELF_TRIPLE:-riscv64-unknown-elf}"
                  BUILD_GLIBC="$(getconf GNU_LIBC_VERSION)"
                  GCC_BRANCH="${GCC_CFI_BRANCH:-unknown}"
                  GCC_COMMIT="${GCC_CFI_COMMIT:-unknown}"

                  cat > /tmp/release_notes.md << EOF
                  # RISC-V Development Tools for old Linux systems

                  **Build Date:** ${RELEASE_DATE}
                  **Build Time:** ${RELEASE_TIME}
                  **Build Status:** Success

                  ## Compatibility target

                  - **Build OS:** Rocky Linux 8.10 container
                  - **Build glibc:** ${BUILD_GLIBC}
                  - **Host architecture:** x86_64 Linux
                  - **Target architecture:** ${ARCH}
                  - **Target ABI:** ${ABI}

                  This release is intended for Rocky Linux 8 / RHEL 8 compatible systems
                  whose system glibc is 2.28.

                  ## Included Components

                  ### 1. RISC-V GNU Toolchain
                  - **File:** \`riscv-gnu-toolchain_linux_glibc228.tar.gz\`
                  - **Architecture:** ${ARCH}
                  - **ABI:** ${ABI}
                  - **GCC CFI Branch:** \`${GCC_BRANCH}\`
                  - **GCC CFI Commit:** \`${GCC_COMMIT}\`
                  - **Includes:** gcc, g++, binutils, gdb, newlib

                  ### 2. Spike ISA Simulator
                  - **File:** \`spike-riscv-simulator_linux_glibc228.tar.gz\`
                  - **Description:** RISC-V ISA Simulator
                  - **Host C/C++ Toolset:** \`${SPIKE_HOST_TOOLSET}\`
                  - **Boost:** \`${SPIKE_BOOST_VERSION}\` (Regex/System statically linked)
                  - **Runtime check:** Starts in Rocky Linux 8.10 without GCC Toolset

                  ### 3. Proxy Kernel (pk)
                  - **File:** \`riscv-pk_linux_glibc228.tar.gz\`
                  - **Description:** Lightweight proxy kernel for Spike

                  ## Quick Start

                  \`\`\`bash
                  tar -xzf riscv-gnu-toolchain_linux_glibc228.tar.gz -C /opt/
                  export PATH=/opt/riscv/bin:\$PATH

                  tar -xzf spike-riscv-simulator_linux_glibc228.tar.gz
                  cp -r spike/* /opt/riscv/

                  tar -xzf riscv-pk_linux_glibc228.tar.gz
                  cp -r pk_backup/${ELF_TRIPLE}/* /opt/riscv/${ELF_TRIPLE}/
                  export PATH=/opt/riscv/${ELF_TRIPLE}/bin:\$PATH

                  ${ELF_TRIPLE}-gcc --version
                  ${ELF_TRIPLE}-gcc -print-multi-lib
                  spike --help
                  \`\`\`

                  ## Notes

                  - Built in Rocky Linux 8.10 to avoid GLIBC_2.29+ requirements.
                  - Do not rebuild this release on ubuntu-latest if you need Rocky Linux 8 compatibility.
                  EOF

                  echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
                  echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"
                  echo "release_date=${RELEASE_DATE}" >> "$GITHUB_OUTPUT"
                  echo "release_time=${RELEASE_TIME}" >> "$GITHUB_OUTPUT"

                  cat /tmp/release_notes.md

            - name: Create Automatic Release
              if: ${{ inputs.release_mode != 'none' }}
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ steps.release_info.outputs.release_tag }}
                  name: ${{ steps.release_info.outputs.release_title }}
                  body_path: /tmp/release_notes.md
                  files: |
                      /opt/riscv-gnu-toolchain_linux_glibc228.tar.gz
                      /opt/spike-riscv-simulator_linux_glibc228.tar.gz
                      /opt/riscv-pk_linux_glibc228.tar.gz
                  draft: false
                  prerelease: ${{ inputs.release_mode == 'prerelease' }}
                  make_latest: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Stop Rocky Linux build container
              if: ${{ always() }}
              shell: bash
              run: docker rm --force "${BUILD_CONTAINER}" || true
